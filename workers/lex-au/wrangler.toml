name = "lex-au"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[vectorize]]
binding = "LEGISLATION_INDEX"
index_name = "au-legislation"

[[vectorize]]
binding = "LEGISLATION_SECTION_INDEX"
index_name = "au-legislation-section"

# Workers AI binding must be a single table (`[ai]`), not an array (`[[ai]]`)
# and must not also be declared as an inline table at the top of the file.
[ai]
binding = "AI"

# KV namespace for the /coverage endpoint (manifest + first_seen map).
# Namespace `lex_au_acts` — stores:
#   coverage:manifest:latest         — most recent coverage manifest JSON
#   coverage:manifest:{YYYY-MM-DD}   — dated snapshot (90d TTL)
#   coverage:first_seen              — { title_id: iso_date } first-observed map
[[kv_namespaces]]
binding = "KV_BINDING"
id = "0ae3b3b1068d452ba7714efd95a301fe"

# NOTE: `[limits] cpu_ms = …` is a paid-plan feature and the deploy fails on
# the Free plan if it's set, so we rely on the default per-invocation CPU
# budget. The coverage refresh is almost entirely network-bound (1 req/s
# pacing on the source API), so actual CPU usage stays low — JSON.parse of
# each 100-row page and JSON.stringify of the final manifest are the only
# meaningful CPU costs. If free-tier CPU turns out to be tight, the next
# step would be to chunk the refresh into a small state machine driven by
# KV (one page per invocation) rather than trying to raise the limit.
